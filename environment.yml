# Entorno R para el práctico de Spatial Transcriptomics (Magíster en Informática Médica)
# Crear:     micromamba create -f environment.yml -y      (o: conda env create -f environment.yml)
# Post:      micromamba run -n spatial-r Rscript setup_extra.R   (instala Rfast2 desde CRAN)
# Activar:   micromamba activate spatial-r
#
# R queda fijo en 4.5 porque BayesSpace en bioconda solo existe para R 4.5.
# RStudio NO se instala aquí: la versión de conda-forge es antigua y exige R 4.3.
# Usa el RStudio de tu sistema y ábrelo desde una terminal con este entorno activado.
name: spatial-r
channels:
  - conda-forge
  - bioconda
dependencies:
  - r-base=4.5
  # Núcleo (igual que en las clases de scRNA-seq)
  - r-seurat=5.5
  - r-tidyverse
  - r-patchwork
  - r-rmarkdown                 # compilar los .Rmd
  # Lectura de datos 10x / Visium
  - r-hdf5r                     # archivos .h5
  - r-png                       # imagen del tejido
  - r-jsonlite                  # factores de escala
  # Análisis espacial
  - bioconductor-singlecellexperiment
  - bioconductor-bayesspace     # dominios espaciales (Práctico II)
  - r-mclust                    # ARI: mclust::adjustedRandIndex
  - r-ape                       # Moran's I (respaldo si falta Rfast2)
  - r-rfast                     # dependencias de Rfast2 (Moran's I rápido),
  - r-rcppparallel              #   que se instala con setup_extra.R
  # Opcional
  - bioconductor-glmgampoi      # acelera SCTransform (ejercicio opcional del Práctico I)
